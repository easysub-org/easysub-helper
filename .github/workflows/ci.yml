name: helper-ci

# 这个工作流随 easysub-helper 独立成库时生效（在主仓库里该目录被 .gitignore 忽略）。
# 目标：证明"老解释器也能跑"，以及为 Win7 档产出 py3.8 的可执行文件。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行没意义了，直接取消（省 runner 分钟，也让状态更快收敛）
concurrency:
  group: helper-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 说明：GitHub 托管 runner 已不再提供 **3.6 / 3.7**（ubuntu-24.04 的 setup-python 清单里
          # 没有这两个版本，而唯一还带它们的 ubuntu-20.04 镜像已下线），windows-2019 镜像同样下线。
          # 所以"老解释器"这条由两道来守：
          #   1) tests/test_py36_compat.py —— 在**任意** Python 上用 ast 卡 3.6 语法 + 扫 3.6 之后
          #      才有的 API（dataclass / asyncio.run / capture_output= / removeprefix / 海象 …），
          #      每个 job 都会跑，所以 3.6 兼容性并没有失去覆盖；
          #   2) py3.8 是"最后一个支持 Win7 的 CPython"，也正是发布档用的解释器。
          # 想在真 3.6 解释器里跑完整套件的话，只能自建 runner 或本地用 pyenv —— 托管 runner 做不到。
          - { os: ubuntu-22.04, python: "3.8", extras: "[capture]" }   # Win7 同代解释器
          - { os: ubuntu-latest, python: "3.12", extras: "[capture,quality]" }
          - { os: windows-2022, python: "3.8", extras: "[capture]" }   # Win7 发布档
          - { os: windows-latest, python: "3.12", extras: "[capture,quality]" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade "pip<24" setuptools wheel
          python -m pip install -e ".${{ matrix.extras }}"
      - name: Unit tests（无需音频设备）
        shell: bash
        run: python -m unittest discover -s tests -t . -v
      - name: 冒烟（只跑真实存在的入口）
        shell: bash
        run: |
          # 注意：助手**没有子命令**（用户路径是那个窗口；`pair` / `devices` 这类子命令已删）。
          # 这里只验证包能导入、入口能起来、参数解析没问题。
          python -m easysub_helper --version
          python -m easysub_helper --help
          python -c "import easysub_helper, easysub_helper.gui, easysub_helper.net, easysub_helper.audio; print('imports ok')"

  package-macos:
    name: package (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build onefile app
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          # 刻意不带 `quality`：soxr 是 LGPL-2.1-or-later，塞进 PyInstaller 单文件会让
          # "用户可替换该库"这条义务落空。重采样有内置 polyphase FIR 兜底，音质差别很小。
          python -m pip install -e ".[capture]"
          # macOS 图标用 assets/easysub.icns（同样来自插件 logo）；
          # 想要系统音频免驱动，再加 extras: pysysaudio（macOS 14.2+）
          # --windowed：默认入口是 tkinter 窗口，不能带控制台
          pyinstaller --onefile --windowed --name easysub-helper \
            --icon easysub_helper/assets/easysub.icns \
            --add-data "easysub_helper/assets:easysub_helper/assets" \
            easysub_helper/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: easysub-helper-macos
          path: dist/easysub-helper

  package-win7:
    name: package (Win7 / py3.8)
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.8" }
      - name: Build onefile exe（带 UCRT，未打补丁的 Win7 也能起）
        shell: bash
        run: |
          python -m pip install --upgrade "pip<24" setuptools wheel
          # PyInstaller 6.x 的官方支持矩阵只到 Windows 8+（其 README 原话："should work on
          # Windows 7 or newer, but we only officially support Windows 8+"）；Win7 档固定在
          # 仍把 Win7 当受支持平台的 5.13.2，少一个变量。
          python -m pip install "pyinstaller==5.13.2"
          python -m pip install -e ".[capture]"
          # 打包脚本负责：① 把 UCRT（api-ms-win-crt-*.dll + ucrtbase.dll）打进 onefile
          #（Win7 SP1 未打补丁时系统里没有它们，用户会看到 api-ms-win-crt-runtime 缺失）；
          # ② 打完后校验这些 DLL 真的在归档里，缺了就红 —— 我们没有 Win7 真机，
          #    绝不允许 CI"绿着产出一个在 Win7 上起不来的包"。
          # 说明：助手不托管 Web 产物、也不碰模型，产物是自包含的（双击即弹窗口）。
          # 在 Server 2022 上构建的产物**仍需在 Win7 真机验证一次**（见 README 的诚实标注）。
          python tools/build_win7_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: easysub-helper-win7-py38
          path: dist/easysub-helper.exe
